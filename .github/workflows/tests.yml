name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        neovim: [v0.11.5, v0.12.6]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ github.token }}
          version: v2.6.0
          args: --check lua tests
      - run: python3 tests/run.py default --output "$RUNNER_TEMP/test-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.neovim }}
          path: ${{ runner.temp }}/test-results
